    const tl = gsap.timeline({ paused: true });

    // Phrases roll like a slot: each lands with its cut, leaves upward with the next
    const cuts = [0.12, 1.03, 2.12, 3.23];
    ["#circle-p1", "#circle-p2", "#circle-p3", "#circle-p4"].forEach((s, i) => {
      tl.fromTo(
        s,
        { opacity: 0, y: 36, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.2, ease: "power3.out" },
        cuts[i],
      );
      if (i < 3) {
        tl.to(s, { opacity: 0, y: -36, filter: "blur(6px)", duration: 0.14, ease: "power2.in" }, cuts[i + 1] - 0.1);
      }
    });
    // Close: circle shrinks to the burgundy point the lockup starts from
    tl.to("#circle-p4", { opacity: 0, filter: "blur(8px)", duration: 0.12, ease: "power2.in" }, 4.18);

      "#circle-window",
      { clipPath: "circle(1.2% at 50% 50%)", duration: 0.36, ease: "power3.in" },
      3.92,
